name: Policy Checker CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - 'docs/**'
  push:
    branches:
      - main

jobs:
  run-policy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (none required)
        run: |
          python -m pip install --upgrade pip
          # Install extras if you add dependencies to requirements.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run policy checker on sample policies
        run: |
          python -c "import sys, json; from src.utils import load_json; from src.policy_checker import score_policy; p=load_json('examples/sample_policies.json'); print('Loaded', len(p),'policy items'); r, s = score_policy(p[0]); print('Sample policy score', s)"
